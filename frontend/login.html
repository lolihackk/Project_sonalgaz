
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        SONALGAZ Dispatching
    </title>

    <link rel="stylesheet"
          href="css/style.css">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body class="login-page">

    <div class="login-wrapper">

        <!-- LEFT SIDE -->

        <div class="login-left">

            <div class="left-content">

                <h1>
                    SONALGAZ
                </h1>

                <p>
                    Dispatching & Transfer
                    Management Platform
                </p>

                <div class="features">

                    <div class="feature-card">
                        Real-time transfer monitoring
                    </div>

                    <div class="feature-card">
                        Smart voltage management
                    </div>

                    <div class="feature-card">
                        Monthly bilan analytics
                    </div>

                </div>

            </div>

        </div>

        <!-- RIGHT SIDE -->

        <div class="login-right">

            <form id="loginForm"
                  class="pro-login-form">

                <div class="login-header">

                    <h2>
                        Welcome Back
                    </h2>

                    <p>
                        Login to continue
                        to the dispatching system
                    </p>

                </div>

                <!-- USERNAME -->

                <div class="input-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required>

                </div>

                <!-- PASSWORD -->

                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required>

                        <i
                            id="togglePassword"
                            class="fa-solid fa-eye toggle-password">
                        </i>

                    </div>

                </div>

                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>

                <!-- FOOTER -->

                <div class="login-footer">

                    SONALGAZ • Dispatching Center

                </div>

            </form>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
