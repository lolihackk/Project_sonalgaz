<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Dashboard
    </title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

    <div class="layout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <h2 class="logo">
                SONALGAZ
            </h2>

            <nav>

                <a href="../index.html">
                    Dashboard
                </a>

                <a href="new-message.html">
                    New Message
                </a>

                <a href="messages.html">
                    Messages
                </a>

                <a href="bilan.html">
                    Bilan Mensuel
                </a>
<button id="logoutBtn"
        class="logout-btn">

    Logout

</button>
            </nav>

        </aside>

        <!-- MAIN -->

        <main class="main-content">

            <!-- NAVBAR -->

            <header class="navbar">

                <h1>
                    Dispatching Dashboard
                </h1>

            </header>

            <!-- CARDS -->

            <section class="cards">

                <div class="card">

                    <h3>
                        Total Messages
                    </h3>

                    <p id="totalMessages">
                        0
                    </p>

                </div>

                <div class="card">

                    <h3>
                        Active Transfers
                    </h3>

                    <p id="activeTransfers">
                        0
                    </p>

                </div>

                <div class="card">

                    <h3>
                        Finished Transfers
                    </h3>

                    <p id="finishedTransfers">
                        0
                    </p>

                </div>

            </section>

            <!-- CHARTS -->

            <section class="charts">

                <!-- VOLTAGE CHART -->

                <div class="chart-card">

                    <h2>
                        Transfers By Voltage
                    </h2>

                    <canvas id="voltageChart"></canvas>

                </div>

                <!-- STATUS CHART -->

                <div class="chart-card">

                    <h2>
                        Transfers By Status
                    </h2>

                    <canvas id="statusChart"></canvas>

                </div>

            </section>

        </main>

    </div>

    <!-- CHART JS -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- DASHBOARD JS -->

    <script src="../js/dashboard.js"></script>

</body>

</html>
