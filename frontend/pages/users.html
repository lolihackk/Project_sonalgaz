<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Users Management
    </title>


    <link rel="stylesheet"
          href="../css/style.css">


    <!-- TOASTIFY -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>


<body>


<div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">


        <h2 class="logo">
            SONALGAZ
        </h2>



        <nav>


            <div id="userInfo"
                 class="user-info">
            </div>



            <a href="../index.html">
                Dashboard
            </a>


            <a href="new-message.html">
                New Message
            </a>


            <a href="messages.html">
                Messages
            </a>


            <a href="bilan.html">
                Bilan Mensuel
            </a>



            <a href="users.html"
               id="adminLink">

                Admin Users

            </a>



            <button
                id="logoutBtn"
                class="logout-btn">

                Logout

            </button>


        </nav>


    </aside>







    <!-- MAIN CONTENT -->

    <main class="main-content">



<div class="page-header">

    <div class="page-header-left">

        

        <div>

            <h1>
                Users Management
            </h1>

            <p>
                SONALGAZ • Administration
            </p>

        </div>

    </div>

    <div class="bilan-badge">

        Admin Panel

    </div>

</div>







        <!-- USERS TABLE -->


        <div class="table-container">


            <h2>
                System Users
            </h2>



            <table>


                <thead>


<tr>

    <th>
        Username
    </th>


    <th>
        Role
    </th>


    <th>
        Actions
    </th>

</tr>


                </thead>



                <tbody id="usersTable">


                </tbody>


            </table>


        </div>







        <!-- CREATE USER -->


        <div class="table-container">


            <h2>
                Create New User
            </h2>



            <div class="user-create-box">



                <input
                    id="newUsername"
                    placeholder="Username">



<div class="password-wrapper">

    <input
        id="newPassword"
        placeholder="Password"
        type="password">


    <i
        id="toggleNewPassword"
        class="fa-solid fa-eye toggle-password">
    </i>

</div>



                <select id="newRole">


                    <option value="dispatcher">

                        Dispatcher

                    </option>



                    <option value="admin">

                        Admin

                    </option>


                </select>




                <button
                    id="createUserBtn"
                    class="save-btn">

                    Create User

                </button>



            </div>


        </div>



    </main>


</div>

<!-- EDIT USER MODAL -->

<div
    id="editUserModal"
    class="modal-overlay"
>

    <div class="modal-box">


        <h2>
            Edit User
        </h2>


        <!-- USERNAME -->

        <div class="modal-input">

            <label>
                Username
            </label>


            <input
                id="editUsername"
                type="text"
                placeholder="Username"
            >

        </div>




        <!-- PASSWORD -->

        <div class="modal-input">


            <label>
                New Password
            </label>


            <div class="password-wrapper">


                <input
                    id="editPassword"
                    type="password"
                    placeholder="Leave empty to keep old password"
                >


                <i
                    id="toggleEditPassword"
                    class="fa-solid fa-eye toggle-password">
                </i>


            </div>


        </div>





        <!-- ROLE -->

        <div class="modal-input">

            <label>
                Role
            </label>


            <select id="editRole">


                <option value="admin">
                    Admin
                </option>


                <option value="dispatcher">
                    Dispatcher
                </option>


            </select>


        </div>






        <!-- ACTIONS -->

        <div class="modal-actions">


            <button
                id="cancelUserEdit"
                class="cancel-btn"
            >

                Cancel

            </button>



            <button
                id="saveUserEdit"
                class="confirm-btn"
            >

                Save Changes

            </button>


        </div>


    </div>

</div>

<!-- DELETE USER MODAL -->

<div
    id="deleteUserModal"
    class="modal-overlay"
>

    <div class="modal-box">


        <h2>
            Confirm Delete
        </h2>


        <p>
            Are you sure you want
            to delete this user?
        </p>



        <div class="modal-actions">


            <button
                id="cancelUserDelete"
                class="cancel-btn"
            >

                Cancel

            </button>



            <button
                id="confirmUserDelete"
                class="confirm-btn"
            >

                Delete

            </button>


        </div>


    </div>

</div>


<!-- TOASTIFY -->

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>



<!-- AUTH -->

<script src="../js/auth-check.js"></script>



<!-- USER INFO -->

<script src="../js/user-info.js"></script>



<!-- USERS JS -->

<script src="../js/users.js"></script>
<script src="../js/mobile-menu.js"></script>


</body>

</html>
